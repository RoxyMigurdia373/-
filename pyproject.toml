[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectopo-check"
version = "0.1.0"
description = "Deterministic local polygon topology checks"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "geopandas>=0.14", "pyogrio", "typer>=0.12", "pydantic>=2.0", "pyyaml"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vectopo-check = "vectopo_check.cli:app"

[tool.setuptools.packages.find]
include = ["vectopo_check*"]

[tool.setuptools.package-data]
vectopo_check = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
